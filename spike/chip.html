<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live chip spike</title>
<style>
  :root { --base: #040B09; }
  html, body { margin: 0; height: 100%; background: var(--base); overflow: hidden; }
  .stage { position: fixed; inset: 0; }
  /* Poster is the first paint and the fallback (no JS, no WebGL, reduced data). Same still as beat 1. */
  .poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 68% 50%; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 600ms cubic-bezier(0.23, 1, 0.32, 1); }
  canvas.on { opacity: 1; }
  /* Stand-in for the .blend's haze volume: a faint glow up and to the right, over the scene. */
  .haze { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity 600ms cubic-bezier(0.23, 1, 0.32, 1);
    background: radial-gradient(60% 55% at 78% 30%, rgba(150, 160, 160, 0.16), rgba(150, 160, 160, 0) 70%); mix-blend-mode: screen; }
  canvas.on + .haze { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { canvas { transition: none; } }
</style>
</head>
<body>
  <div class="stage">
    <img class="poster" src="./poster.png" alt="A dark chip with gold leads, lit by a single light">
    <canvas id="chip" aria-hidden="true"></canvas>
    <div class="haze" aria-hidden="true"></div>
  </div>
  <script type="module" src="./chip.js"></script>
</body>
</html>
